  header .sub{

  header .count{

    border-radius:20px;

  .layout{

    color:var(--text-dim);

      ">
      <span style="
        transform:rotate(45deg);

const markers = {{}};
const bounds = [];

DATA.forEach(item => {{
  const marker = L.marker([item.lat, item.lon], {{ icon: makeIcon(item) }}).addTo(map);
  const priceText = item.price ? `總價 ${{item.price}} 萬` : '售價未標示';
  const agentText = item.agent ? `承辦 ${{item.agent}}` : '';
  let html = `<div class="popup-name">${{item.id}}. ${{item.name}}</div>`;
  html += `<div class="popup-addr">${{item.addr || ''}}</div>`;
  html += `<div class="popup-row"><strong>${{priceText}}</strong>${{agentText ? ' ｜ ' + agentText : ''}}</div>`;
  if(item.key){{ html += `<div class="popup-row" style="color:#8a5a12;font-weight:700;">🔑 本店有鑰匙，可即時帶看</div>`; }}
  if(item.detail){{ html += `<div class="popup-detail">${{item.detail}}</div>`; }}
  if(item.approx){{ html += `<div class="popup-row" style="color:#a4462f;">⚠ 座標為概略位置，門牌待補</div>`; }}
  if(item.link){{ html += `<a class="popup-link" href="${{item.link}}" target="_blank" rel="noopener">查看詳情 →</a>`; }}
  marker.bindPopup(html, {{ maxWidth: 280 }});
  markers[item.id] = marker;
  bounds.push([item.lat, item.lon]);
}});

if(bounds.length){{ map.fitBounds(bounds, {{ padding: [30,30] }}); }}

let activeFilter = 'all';
let searchTerm = '';
let priceRange = 'all';

function passesFilter(item){{
  if(activeFilter === 'new' && !item.new) return false;
  if(activeFilter === 'link' && !item.link) return false;
  if(activeFilter === 'key' && !item.key) return false;
  if(priceRange !== 'all'){{
    const p = item.price;
    if(p === null || p === undefined || p === '') return false;
    const [lo, hi] = priceRange.split('-');
    if(lo && p < Number(lo)) return false;
    if(hi && p >= Number(hi)) return false;
  }}
  if(searchTerm){{
    const hay = (item.name + ' ' + item.addr + ' ' + (item.agent||'') + (item.key ? ' 有鑰匙 key 鑰匙' : '')).toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }}
  return true;
}}

function renderList(){{
  const list = document.getElementById('list');
  const filtered = DATA.filter(passesFilter);
  document.getElementById('countBadge').textContent = `共 ${{DATA.length}} 筆・🔑 ${{DATA.filter(d=>d.key).length}} 筆有鑰匙・顯示 ${{filtered.length}} 筆`;

  DATA.forEach(item => {{
    const m = markers[item.id];
    if(!m) return;
    if(passesFilter(item)){{ if(!map.hasLayer(m)) m.addTo(map); }}
    else if(map.hasLayer(m)){{ map.removeLayer(m); }}
  }});

  if(filtered.length === 0){{
    list.innerHTML = '<div class="empty-state">沒有符合條件的物件</div>';
    return;
  }}

  list.innerHTML = filtered.map(item => {{
    const priceText = item.price ? `${{item.price}}萬` : '售價未標示';
    let tags = '';
    if(item.key) tags += '<span class="tag key">🔑 有鑰匙</span>';
    if(item.new) tags += '<span class="tag new">新增</span>';
    if(item.link) tags += '<span class="tag link">有連結</span>';
    if(item.approx) tags += '<span class="tag approx">座標概略</span>';
    return `<div class="item" data-id="${{item.id}}">
      <div class="item-top">
        <div class="item-name"><span class="num">#${{item.id}}</span>${{item.name}}</div>
        <div class="item-price">${{priceText}}</div>
      </div>
      <div class="item-addr">${{item.addr || ''}}${{item.agent ? ' ｜ 承辦 ' + item.agent : ''}}</div>
      <div class="item-tags">${{tags}}</div>
    </div>`;
  }}).join('');

  list.querySelectorAll('.item').forEach(el => {{
    el.addEventListener('click', () => {{
      const id = parseInt(el.dataset.id, 10);
      const item = DATA.find(d => d.id === id);
      if(!item) return;
      map.setView([item.lat, item.lon], 17, {{ animate: true }});
      markers[id].openPopup();
      document.querySelectorAll('.item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    }});
  }});
}}

document.getElementById('searchInput').addEventListener('input', (e) => {{
  searchTerm = e.target.value.trim().toLowerCase();
  renderList();
}});

document.querySelectorAll('.chip').forEach(chip => {{
  chip.addEventListener('click', () => {{
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    renderList();
  }});
}});

document.getElementById('priceRange').addEventListener('change', (e) => {{
  priceRange = e.target.value;
  e.target.classList.toggle('active', priceRange !== 'all');
  renderList();
}});

renderList();
</script>
</body>
